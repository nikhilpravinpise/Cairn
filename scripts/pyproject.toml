[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cairn", "cairn.runners"]

[project]
name = "cairn-scripts"
version = "0.1.0"
description = "Cairn Week-1 spike harnesses, eval, data pipeline, fine-tune"
requires-python = ">=3.11"

dependencies = [
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "pillow>=10.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer[all]>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Ollama runner (E4B on Mac)
ollama = ["ollama>=0.2"]
# Gemini API for synthetic dialogue generation (D5)
gemini = ["google-generativeai>=0.7"]
# Audio eval (S4)
audio = ["soundfile>=0.12", "librosa>=0.10"]
# Fine-tune side (Colab: unsloth; local: we shim)
finetune = [
  "unsloth>=2024.10 ; platform_system == 'Linux'",
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "datasets>=2.20",
  "trl>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
