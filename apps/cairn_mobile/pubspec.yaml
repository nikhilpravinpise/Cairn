name: cairn_mobile
description: Cairn — offline FEMA P-154 triage (Week-1 web-first flutter_gemma spike; mobile targets added later)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^0.13.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  crypto: ^3.0.3
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/prompts/
