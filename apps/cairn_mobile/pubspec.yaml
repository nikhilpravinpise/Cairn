name: cairn_mobile
description: Cairn — offline FEMA P-154 triage (Week-1 web-first flutter_gemma spike; mobile targets added later)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_gemma: 0.14.0
  cupertino_icons: ^1.0.8
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  crypto: ^3.0.3
  logging: ^1.2.0
  uuid: ^4.4.0
  go_router: ^14.2.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  record: 5.2.1
  path_provider: ^2.1.5
  printing: ^5.13.0
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.0.0

dependency_overrides:
  # record 5.2.1 pins record_linux to <1.0.0 but record_platform_interface 1.5.0
  # (required by record_android 1.5.1) added startStream() which record_linux 0.7.2
  # never implemented. Force 1.3.0 to unblock Android Dart kernel compilation.
  # record_linux is the Linux desktop impl; it does not run on Android.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/prompts/
    - assets/schema/
